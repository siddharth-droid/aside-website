<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Built by src/build.py from src/template.html: edit those, then run `python src/build.py`. Look: SPEC.md. */
      @font-face { font-family: "Apfel Grotezk"; src: url("assets/fonts/apfel-grotezk-regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Apfel Grotezk"; src: url("assets/fonts/apfel-grotezk-mittel.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Apfel Grotezk"; src: url("assets/fonts/apfel-grotezk-fett.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Doto"; src: url("assets/fonts/doto-wght.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
      :root {
        --kraft: #e9dfca; --news: #f7f2e7; --ink: #141210; --red: #e2412f; --yellow: #f2c230; --blue: #2f5bd3; --teal: #4fc4bb;
        --font: "Apfel Grotezk", sans-serif; --dot: "Doto", monospace; --serif-i: "Instrument Serif", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--kraft); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--kraft); }
      #board { position: absolute; inset: 0; transform-origin: 50% 55%; }
      #board::before { content: ""; position: absolute; inset: -60px; background-image: radial-gradient(rgba(20, 18, 16, 0.12) 1.4px, transparent 1.9px); background-size: 9px 9px; }
      .piece { position: absolute; }
      .in { position: relative; transform-origin: 50% 50%; }
      .torn .in { clip-path: polygon(0 1.5%, 5% 0, 11% 1.2%, 18% 0, 26% 1.6%, 33% 0.4%, 41% 1.4%, 49% 0, 57% 1.2%, 65% 0, 73% 1.6%, 81% 0.4%, 89% 1.4%, 96% 0, 100% 1%, 99.4% 50%, 100% 98.6%, 94% 100%, 87% 98.6%, 79% 100%, 71% 98.4%, 63% 100%, 55% 98.8%, 47% 100%, 39% 98.4%, 31% 100%, 23% 98.6%, 15% 100%, 7% 98.4%, 0 99.4%, 0.6% 50%); }
      .torn { filter: drop-shadow(6px 9px 10px rgba(40, 25, 10, 0.3)); }

      .tag .in { display: inline-block; padding: 10px 22px 6px; background: var(--yellow); font: 800 76px/1 var(--dot); box-shadow: 4px 5px 0 rgba(0, 0, 0, 0.2); }

      .mail .in { background: var(--news); padding: 40px 48px 52px; }
      .mail__head { font: 500 28px/1.3 var(--font); color: #6b645b; padding-bottom: 18px; border-bottom: 2px solid rgba(20, 18, 16, 0.12); margin-bottom: 22px; }
      .mail__head b { font-weight: 700; color: var(--ink); margin-right: 10px; }
      .mail__head i { font-style: normal; margin: 0 8px; }
      .mail p { font: 500 36px/1.36 var(--font); letter-spacing: -0.01em; }
      .mail__sent { position: relative; margin-top: 14px; min-height: 150px; }
      .sent { position: relative; display: block; isolation: isolate; }
      .sent--new { position: absolute; left: 0; top: 0; opacity: 0; color: var(--ink); }
      .selbar { position: absolute; inset: -4px -8px; background: rgba(245, 167, 66, 0.5); transform-origin: 0 50%; transform: scaleX(0); z-index: -1; }
      .ring { position: absolute; left: 24px; top: 126px; width: 900px; height: 240px; overflow: visible; }
      .ring path { fill: none; stroke: var(--red); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 2400; stroke-dashoffset: 2400; }

      .cast .in { width: 330px; height: 360px; }
      .sticker { position: absolute; inset: 0; filter: drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff) drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff) drop-shadow(8px 12px 10px rgba(0, 0, 0, 0.3)); }
      .sticker svg { width: 100%; height: auto; }
      .sam-f, .sam-r { opacity: 0; }

      .browser .in { width: 700px; height: 520px; background: #fff; }
      .br__bar { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 20px; background: #dfe3e8; }
      .br__bar i { width: 14px; height: 14px; border-radius: 50%; background: #b9c0c9; }
      .br__url { flex: 1; height: 26px; margin-left: 16px; border-radius: 13px; background: #fff; }
      .br__tabs { display: flex; gap: 6px; padding: 10px 16px; background: #eef1f4; }
      .br__tabs span { width: 86px; height: 26px; border-radius: 6px; background: #d6dbe1; }
      .br__tabs .is-on { background: #fff; box-shadow: inset 0 0 0 2px var(--ink); }
      .br__chat { position: relative; padding: 26px 30px; }
      .br__in { min-height: 170px; padding: 18px 20px; border-radius: 14px; background: #f1f3f6; font: 500 28px/1.34 var(--font); color: #2a2c31; }
      #chatPaste, #chatExplain { display: inline; }
      #chatPaste { opacity: 0; }
      #chatExplain { color: #4a5568; clip-path: inset(0 100% 0 0); }
      .br__wait { position: absolute; left: 50px; top: 230px; display: flex; gap: 10px; opacity: 0; }
      .br__wait i { width: 16px; height: 16px; border-radius: 50%; background: #9aa3ae; }
      .br__ans { margin-top: 18px; padding: 16px 20px; border-radius: 14px; background: #e3ecff; font: 500 28px/1.34 var(--font); opacity: 0; }
      .tabring svg { width: 170px; overflow: visible; }
      .tabring path, .arrow path, .lens circle, .lens path { fill: none; stroke: var(--red); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .tabring path { stroke-dasharray: 500; stroke-dashoffset: 500; }
      .arrow svg { width: 300px; overflow: visible; }
      .arrow .draw { stroke-dasharray: 8 14; stroke-dashoffset: 600; }
      .arrow .head { opacity: 0; }
      .lens .in { opacity: 0; }
      .lens svg { width: 150px; overflow: visible; }

      .keys .in { display: flex; align-items: center; gap: 10px; }
      .key { display: inline-flex; align-items: center; justify-content: center; height: 64px; min-width: 64px; padding: 0 18px; background: #fff; color: var(--ink); font: 700 28px/1 var(--font); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 6px 0 var(--ink); }
      .keys b { font: 700 32px var(--font); }
      .keys--big .key { height: 84px; min-width: 84px; font-size: 36px; padding: 0 24px; border-radius: 14px; box-shadow: 0 8px 0 var(--ink); }

      .stamp .in { display: inline-block; padding: 12px 22px 8px; border: 6px solid var(--red); color: var(--red); font: 800 44px/1 var(--dot); background: rgba(247, 242, 231, 0.85); }

      .counter .in { display: flex; align-items: baseline; gap: 12px; padding: 14px 24px 10px; background: var(--ink); color: var(--news); box-shadow: 5px 6px 0 rgba(0, 0, 0, 0.22); }
      .counter__l { font: italic 46px/1 var(--serif-i); }
      .counter__n { display: inline-block; font: 800 92px/1 var(--dot); color: var(--yellow); }
      .counter__of { font: 800 46px/1 var(--dot); opacity: 0.6; }

      .dim .in { width: 1920px; height: 1080px; background: rgba(233, 223, 202, 0.72); opacity: 0; }
      .ransom .in { white-space: nowrap; }
      .r { display: inline-block; padding: 10px 26px 6px; font-size: 150px; line-height: 1; letter-spacing: -0.03em; box-shadow: 6px 8px 0 rgba(0, 0, 0, 0.22); }
      .r--ink { background: var(--ink); color: var(--news); font-family: var(--serif-i); font-style: italic; font-weight: 400; }
      .r--red { background: var(--red); color: #fff; font-family: var(--serif-i); font-style: italic; }
      .r--yellow { background: var(--yellow); font-weight: 700; letter-spacing: -0.06em; }
      .r--blue { background: var(--blue); color: #fff; font-weight: 700; letter-spacing: -0.06em; }
      .ransom--end .r { font-size: 168px; }

      .orb .in { width: 560px; height: 560px; }
      .orb img, .orbend img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #orbThink, #orbHappy { opacity: 0; }
      .orbend .in { width: 840px; height: 840px; }

      .panel .in { padding: 26px 30px 26px; border-radius: 26px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 80px), #1b1b1e; color: #d6d6da; font-family: "Geist", sans-serif; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.12), 0 30px 60px -20px rgba(0, 0, 0, 0.6); opacity: 0; }
      .panel__q { display: block; font-size: 28px; color: #8b8b92; }
      .panel b { display: block; margin-top: 10px; font: 700 34px/1.3 Georgia, serif; color: #f4f4f5; }
      .panel__b { display: block; margin-top: 10px; font-size: 28px; }
      .panel__acts { display: flex; gap: 10px; margin-top: 20px; }
      .panel__acts i { font-style: normal; padding: 8px 16px; border-radius: 20px; background: rgba(255, 255, 255, 0.07); font-size: 28px; color: #f4f4f5; }
      .panel__acts .on { background: rgba(255, 255, 255, 0.2); }

      .echo .in { position: relative; min-height: 580px; padding: 44px 44px 40px 300px; background: var(--news); }
      .echo__who { position: absolute; left: 24px; top: 40px; width: 250px; filter: drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(6px 10px 8px rgba(0, 0, 0, 0.28)); }
      .echo__who svg { width: 100%; height: auto; }
      .echo__who--done { opacity: 0; }
      .echo__t { font: 800 34px/1 var(--dot); color: #9a5410; }
      .echo__code { margin-top: 18px; padding: 16px 18px; background: #17181c; color: #ff9b9b; font: 500 28px/1.35 Consolas, monospace; border-radius: 10px; }
      .echo__de { margin-top: 18px; font: 500 28px/1.4 var(--font); color: #2a2c31; }
      .echo__ans { margin-top: 18px; padding: 18px 20px; border-radius: 16px; background: #1b1b1e; color: #d6d6da; font: 400 28px/1.4 "Geist", sans-serif; opacity: 0; }
      .echo__ans b { display: block; margin-bottom: 6px; font: 700 28px/1.3 Georgia, serif; color: #f4f4f5; }
      .echo__keys { position: relative; margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .echo__keys .key, .echo__keys b { opacity: 0; }
      .echo__keys .key { height: 58px; min-width: 58px; font-size: 28px; padding: 0 14px; }

      .dl .in { display: inline-block; padding: 14px 24px 10px; background: var(--news); font: 700 38px/1 var(--font); letter-spacing: -0.02em; box-shadow: 4px 5px 0 rgba(0, 0, 0, 0.18); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="board">
{{PIECES}}
      </div>
{{AUDIO}}
    </div>
    <script>
{{SCRIPT}}
    </script>
  </body>
</html>
